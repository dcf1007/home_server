# my-cdd Simple-CDD 0.6.9 build configuration for Debian 13 Trixie, amd64.
# Source: ../01_custom_cdd_preparation.md and Debian Simple-CDD 0.6.9 variables.py
# Status: source configuration; not evidence of a validated ISO.
#
# These are INCLUDED / OFFERED profiles, NOT AUTO-SELECTED profiles.
profiles="backports ensure-7x-kernel extended-device-support zram-writeback debian-tweaks openmediavault docker"
auto_profiles=""
default_profiles=""

# Fixed target distribution and architecture; build-simple-cdd called with
# --dist trixie by build.sh. Do not take distribution from a newer build host.
CODENAME="trixie"
ARCH="amd64"
ARCHES="amd64"

# Debian 13 binary components. Backports is enabled only by its selected
# installed-target profile; this build setting does NOT enable it there.
mirror_components="main contrib non-free non-free-firmware"
debian_mirror="https://deb.debian.org/debian/"
updates_mirror="https://deb.debian.org/debian/"
security_mirror="https://security.debian.org/debian-security/"

# These sources are copied into /cdrom/simple-cdd. The APPROVED default
# preseed/early_command invokes profile-confirm.sh BEFORE anna-install
# simple-cdd-profiles; the upstream udeb is unmodified. The script loads
# both upstream and my-cdd templates and uses Debconf's native UI.
# Runtime viability (GTK/text, seen flags, duplicate-prompt suppression)
# remains UNTESTED, and the selected-profile executor is not installed.
all_extras="installer/profile-confirm.sh installer/profile-confirm.templates installer/ordered-selection.sh installer/run-selected.sh installer/profile-actions.sh scripts/firmware-candidates.txt scripts/debian-backports.sources scripts/90-zram-swappiness.conf scripts/zram-generator.conf.template scripts/10-compressed-writeback.conf scripts/zram-pressure.sh scripts/zram-pressure.service"

# Native installer screens must remain editable, so no automatic locale,
# keyboard, account, partition, networking or tasksel preseeding here.
# The canonical suggested values live in ./profile_defaults.conf.
# Simple-CDD supplies its own required default.preseed boot reference.
#
# A zero boot timeout is the intended indefinite wait; validate the actual
# generated GRUB and ISOLINUX menus before allowing an installable image.
BOOT_TIMEOUT="0"
# Do not set proposed_updates, global Backports pins, auto_profiles or
# unapproved third-party package repositories.
